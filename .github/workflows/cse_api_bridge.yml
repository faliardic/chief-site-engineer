name: CSE API Bridge

on:
  schedule:
    - cron: "*/5 * * * *"
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request == null &&
       contains(github.event.comment.body, 'CSE_BRIDGE_APPROVED'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: cse-api-bridge
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CSE_BRIDGE_MODEL: ${{ vars.CSE_BRIDGE_MODEL }}
      CSE_BRIDGE_BASE: master
    steps:
      - name: Clone canonical repository
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          git clone --no-tags "https://github.com/$GITHUB_REPOSITORY.git" repo
      - name: Bridge unit tests
        working-directory: repo
        run: >-
          python -m unittest discover -s tests
          -p 'test_cse_*bridge*.py' -v
      - name: Bridge compile check
        working-directory: repo
        run: >-
          python -m compileall -q
          tools/cse_api_bridge.py
          tools/cse_bridge_poll.py
          tests/test_cse_api_bridge.py
          tests/test_cse_bridge_poll.py
      - name: Execute next approved task
        working-directory: repo
        run: python tools/cse_bridge_poll.py --repo-root .
