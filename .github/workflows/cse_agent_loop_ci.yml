name: CSE Agent Loop CI

on:
  pull_request:
    paths:
      - ".github/workflows/cse_agent_loop.yml"
      - ".github/workflows/cse_agent_loop_ci.yml"
      - ".gitignore"
      - "tools/cse_agent_loop.py"
      - "tools/cse_bridge_poll.py"
      - "tests/test_cse_agent_loop.py"
      - "tests/test_cse_bridge_poll.py"
      - "docs/cse_agent_loop*.md"
      - "learning/cse_agent_loop_mvp.md"

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile changed Python modules
        run: |
          python -m compileall -q \
            tools/cse_agent_loop.py \
            tools/cse_bridge_poll.py \
            tests/test_cse_agent_loop.py \
            tests/test_cse_bridge_poll.py

      - name: Run focused tests
        run: |
          python -m pytest -q \
            tests/test_cse_agent_loop.py \
            tests/test_cse_bridge_poll.py

      - name: Check whitespace errors
        run: git diff --check origin/${{ github.base_ref }}...HEAD
