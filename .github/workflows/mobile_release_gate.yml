name: Mobile release gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-free-mobile-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: android-actions/setup-android@v3

      - name: Install Android API 36 and 16 KB tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Flutter static and executable gates
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test --no-pub
          flutter build apk --debug --target-platform android-arm64
          python ../scripts/prepare_flutter_release_registrant.py
          flutter build appbundle --release --target-platform android-arm64

      - name: Static, merged-manifest, API 36 and ARM64 assertions
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(find mobile/build/app/intermediates/merged_manifests/release -name AndroidManifest.xml -print -quit)"
          test -n "$manifest"
          python scripts/validate_mobile_release.py \
            --require-plugin-privacy-inventory \
            --merged-manifest "$manifest" \
            --aab mobile/build/app/outputs/bundle/release/app-release.aab

      - name: Universal APK and 16 KB artifact gate
        shell: bash
        run: |
          set -euo pipefail
          temp_root="$(mktemp -d)"
          trap 'rm -rf -- "$temp_root"' EXIT
          curl --fail --location --silent --show-error \
            --output "$temp_root/bundletool.jar" \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $temp_root/bundletool.jar" | sha256sum --check --status
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          keytool -genkeypair -storetype PKCS12 \
            -keystore "$temp_root/ephemeral.p12" -alias cse-ephemeral \
            -keyalg RSA -keysize 3072 -validity 2 \
            -dname "CN=CSE Ephemeral Release Gate, O=Local Test, C=TR" \
            -storepass "$password" -keypass "$password" -noprompt
          java -jar "$temp_root/bundletool.jar" build-apks \
            --bundle=mobile/build/app/outputs/bundle/release/app-release.aab \
            --output="$temp_root/universal.apks" --mode=universal \
            --ks="$temp_root/ephemeral.p12" --ks-key-alias=cse-ephemeral \
            --ks-pass="pass:$password" --key-pass="pass:$password"
          unzip -q "$temp_root/universal.apks" universal.apk -d "$temp_root"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$temp_root/universal.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$temp_root/universal.apk"
          python scripts/validate_mobile_release.py \
            --require-plugin-privacy-inventory \
            --apk "$temp_root/universal.apk"

      - name: Python and repository gates
        run: |
          python -m pytest -rs
          python -m compileall -q app scripts
          python -m json.tool .cse/state/project_state.json >/dev/null
          git diff --check
