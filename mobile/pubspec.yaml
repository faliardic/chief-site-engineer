name: chief_site_engineer
description: Chief Site Engineer offline-first mobile foundation.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.0.9
  clock: ^1.1.2
  crypto: ^3.0.7
  cryptography: ^2.9.0
  file_picker: ^10.3.10
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.0.1
  image_picker: ^1.2.1
  open_filex: ^4.7.0
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^12.0.1
  pdf: ^3.11.3
  share_plus: ^12.0.1
  sqflite: ^2.4.3
  timezone: ^0.11.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  sqflite_common_ffi: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
